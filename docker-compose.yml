services:

  db:
    image: postgres:16-alpine
    container_name: chgdesarrollo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: chgdesarrollo
      POSTGRES_USER: ${DB_USER:-chg}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  api:
    build:
      context: ./backend
    container_name: chgdesarrollo-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/chgdesarrollo
      DB_USER: ${DB_USER:-chg}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      UPLOADS_DIR: /data/uploads
      CORS_ALLOWED_ORIGINS: https://chgdesarrollo.cl,https://www.chgdesarrollo.cl
    volumes:
      - uploads:/data/uploads
    networks:
      - internal

  landing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chgdesarrollo-landing
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "80"
    networks:
      - internal
      - proxy

volumes:
  db-data:
  uploads:

networks:
  internal:
  proxy:
    external: true
